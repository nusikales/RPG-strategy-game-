<title>Plieno Frontas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen map canvas, stat bar on top, tab bar below, bottom sheets for every panel */
:root{
  --sea:#0d1c26; --sea2:#132a37;
  --panel:#16242d; --panel2:#1e313c; --line:#2d4652;
  --fg:#e3ebe7; --muted:#8fa5ab;
  --brass:#d9a441; --brass2:#f0c46a;
  --att:#b3443c; --def:#8c8a35; --hp:#d4534a; --en:#4f9de0; --ok:#5fb37a;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--sea);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{position:relative;height:100%;display:flex;flex-direction:column;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass2);outline-offset:2px;}

/* top stat bar */
#top{display:flex;gap:10px;align-items:center;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#101e27,#14242e);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap;}
.lvl{width:44px;height:44px;border-radius:50%;border:3px solid var(--brass);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;position:relative;flex:none;background:var(--panel);}
.lvl small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:28px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.lvl small i{display:block;height:100%;background:var(--brass2);}
.bars{display:grid;gap:4px;flex:1;min-width:120px;}
.bar{position:relative;height:18px;border-radius:4px;background:#0b161d;overflow:hidden;border:1px solid var(--line);}
.bar i{position:absolute;inset:0 auto 0 0;}
.bar.hp i{background:linear-gradient(90deg,#8e2f2a,var(--hp));}
.bar.en i{background:linear-gradient(90deg,#24557f,var(--en));}
.bar span{position:relative;font-size:12px;font-weight:600;padding-left:6px;line-height:16px;font-variant-numeric:tabular-nums;}
.money{display:grid;gap:2px;text-align:right;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;}
.money b{color:var(--brass2);font-size:17px;}
.money span{font-size:12px;color:var(--muted);}
.clock{display:flex;align-items:center;gap:6px;width:100%;font-size:12px;color:var(--muted);}
.clock .flag{width:14px;height:10px;border-radius:2px;display:inline-block;}
.speed{margin-left:auto;display:flex;gap:4px;}
.speed button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12px;}
.speed button.on{background:var(--brass);color:#1b1305;border-color:var(--brass);font-weight:600;}

#mapwrap{position:relative;flex:1;min-height:0;}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;}
#ticker{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:8px;background:rgba(14,26,33,.88);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#ticker b{color:var(--brass2);font-family:var(--display);font-weight:600;margin-right:6px;}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:44px;display:grid;gap:6px;}
.zoom button{width:40px;height:40px;border-radius:8px;background:rgba(22,36,45,.92);border:1px solid var(--line);font-size:20px;}
.credit{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;background:rgba(14,26,33,.88);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);}
.credit a{color:var(--brass2);font-weight:600;text-decoration:none;}

/* region card */
#rcard{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:44px;margin-right:52px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.45);}
#rcard h3{margin:0;font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:8px;}
#rcard .x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:20px;color:var(--muted);}

/* tab bar */
#tabs{display:grid;grid-template-columns:repeat(7,1fr);background:#101e27;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5;}
#tabs button{background:none;border:0;padding:8px 0 9px;min-width:0;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative;letter-spacing:.02em;}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#tabs button.on{color:var(--brass2);}
#tabs .badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--hp);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:15px;font-weight:600;}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;background:var(--panel);border-top:2px solid var(--brass);border-radius:14px 14px 0 0;display:flex;flex-direction:column;z-index:8;box-shadow:0 -10px 30px rgba(0,0,0,.5);}
#sheet header{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));}
#sheet h2{margin:0;font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase;}
#sheet header button{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;width:34px;height:34px;font-size:18px;}
#sheetBody{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start;grid-auto-rows:max-content;}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;min-width:0;}
.box h4{margin:0;font-family:var(--display);font-size:15px;color:var(--brass2);letter-spacing:.04em;text-transform:uppercase;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.row .grow{flex:1;min-width:0;}
.muted{color:var(--muted);font-size:13px;}
.btn{background:var(--brass);color:#1b1305;border:0;border-radius:6px;padding:9px 14px;font-weight:600;font-family:var(--display);letter-spacing:.03em;}
.btn.alt{background:#2a4250;color:var(--fg);border:1px solid var(--line);}
.btn.red{background:var(--hp);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.sm{padding:6px 10px;font-size:13px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;}
.kv dt{color:var(--muted);} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.4);}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-family:var(--display);}
.vs .side{display:grid;gap:2px;}
.vs .side:last-child{text-align:right;}
.vs .num{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.split{height:10px;border-radius:5px;overflow:hidden;display:flex;background:#0b161d;}
.news{display:grid;gap:6px;font-size:14px;}
.news div{border-left:3px solid var(--line);padding-left:8px;}
.news div.hot{border-color:var(--brass);}
.news time{color:var(--muted);font-size:12px;display:block;}
.cbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;}
.cbtn.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;}
select{background:#0b161d;border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:8px 10px;font:inherit;max-width:100%;min-width:0;}
input[type=range]{width:100%;accent-color:var(--brass);}
.sl{display:grid;gap:2px;}
.sl .row{justify-content:space-between;font-size:14px;}
.sl output{font-family:var(--display);color:var(--brass2);font-variant-numeric:tabular-nums;}
input[type=text]{background:#0b161d;border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:9px 10px;font:inherit;width:100%;}

/* modal */
#modal{position:absolute;inset:0;background:rgba(5,12,16,.82);display:grid;place-items:center;z-index:20;padding:16px;}
#modal .card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:12px;padding:18px;width:min(460px,100%);max-height:100%;overflow:auto;display:grid;gap:12px;}
#modal h1{margin:0;font-family:var(--display);font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass2);line-height:1;}
#modal .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:46px;background:var(--brass);color:#1b1305;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;pointer-events:none;max-width:90%;text-align:center;}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

/* inventory */
#sheet.tall{max-height:calc(100% - 8px);height:calc(100% - 8px);}
h4.sec{margin:4px 0 0;font-family:var(--display);font-size:14px;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
.tile{position:relative;display:grid;justify-items:center;align-content:end;gap:1px;padding:8px 2px 0;background:linear-gradient(180deg,#1a2a33,#22363f);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:96px;}
.tile.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;}
.tile.zero{opacity:.45;}
.tile .ti{font-size:30px;line-height:1;height:38px;display:grid;place-items:center;}
.ti svg,.fw svg{width:34px;height:34px;display:block;}
.ti.sm{font-size:24px;width:34px;text-align:center;flex:none;}.ti.sm svg{width:28px;height:28px;margin:auto;}
.tile .te{font-size:11px;color:#bfe3c9;font-weight:600;}
.tile .tn{width:100%;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;background:rgba(0,0,0,.28);padding:2px 0;font-variant-numeric:tabular-nums;}
.tile.c-food .tn{background:rgba(110,70,160,.35);}.tile.c-gear .tn{background:rgba(160,120,40,.35);}
.tile.wt .fw svg{width:52px;height:40px;}
.tile .eqb{position:absolute;top:0;left:0;background:var(--att);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:0 0 6px 0;}
.tile .dur{width:80%;height:4px;background:#0b161d;border-radius:2px;overflow:hidden;}.tile .dur i{display:block;height:100%;}
.fw{display:inline-grid;vertical-align:middle;}.fw svg{width:22px;height:22px;}.fw.big svg{width:40px;height:34px;}
.lack{color:var(--hp);}
.loadout{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);}
.chip.on{background:#2f4a58;color:var(--fg);border-color:var(--brass);}
.statstrip{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--display);font-weight:600;background:linear-gradient(90deg,#1b2f24,#16242d);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-variant-numeric:tabular-nums;}
.price{font-family:var(--display);font-weight:600;color:var(--brass2);font-variant-numeric:tabular-nums;}
/* battles */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.bcard{display:grid;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;min-width:0;}
.bcard.wide{width:100%;}
.bname{font-family:var(--display);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flagbox{display:inline-grid;place-items:center;width:38px;height:28px;border-radius:4px;border:2px solid;background:#0b161d;font-size:18px;line-height:1;}
.bscore,.bbig{display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--display);}
.bscore b{font-size:22px;color:#9fb6c2;}.bscore i,.bbig i{font-style:normal;color:var(--muted);}
.bpts,.bdmg,.ptsrow{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;}
.bdmg{font-size:12px;font-weight:500;color:var(--muted);}
.pa{color:#e98a80;}.pd{color:#d6d47a;}
.feeds{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;}
.feed{display:grid;gap:3px;min-width:0;}
.fr{display:flex;align-items:center;gap:5px;height:26px;padding:0 6px;border-radius:5px;font-size:12px;background:rgba(255,255,255,.03);min-width:0;}
.feed.r .fr{flex-direction:row-reverse;}
.fr.empty{background:none;}.fr.crit{background:rgba(179,68,60,.25);}.feed.r .fr.crit{background:rgba(140,138,53,.3);}
.fr.me{outline:1px solid var(--brass);}
.fr .av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;}
.fr .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
.fr .fw svg{width:16px;height:16px;}
.fr .fd{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.fmid{display:grid;justify-items:center;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;}
.fmid b{font-family:var(--display);font-size:24px;line-height:1;}
.btitle{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--display);font-size:19px;font-weight:600;text-align:center;}
.btitle .cap{color:#e98a80;}
.bbig{gap:16px;}.bbig b{font-size:40px;line-height:1;color:#9fb6c2;}.bbig i{font-size:22px;}.bbig .flagbox{width:60px;height:42px;font-size:28px;}
.tickrow{display:flex;justify-content:center;gap:14px;align-items:center;font-family:var(--display);}
.gain{font-weight:700;}.gain.a{color:#e98a80;}.gain.d{color:#d6d47a;}
.ptsrow{font-size:24px;}.ptsrow .muted{font-size:12px;font-weight:500;}
.hills{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.hill{height:8px;background:#0b161d;border-radius:4px;overflow:hidden;display:flex;}
.hill.a i{background:var(--att);}.hill.d{justify-content:flex-end;}.hill.d i{background:var(--def);}
.dbar{display:flex;height:56px;border-radius:8px;overflow:hidden;font-family:var(--display);}
.dbar>div{display:grid;align-content:center;padding:0 10px;min-width:0;white-space:nowrap;}
.dbar .a{background:linear-gradient(180deg,#3b5564,#2a4250);}.dbar .d{flex:1;background:linear-gradient(180deg,#8c8a35,#6d6b26);text-align:right;}
.dbar small{font-size:12px;opacity:.85;}.dbar b{font-size:18px;font-variant-numeric:tabular-nums;}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sidecol{display:grid;gap:6px;align-content:start;min-width:0;}
.bon{font-family:var(--display);font-weight:600;color:var(--brass2);white-space:nowrap;}
.fight{border:0;border-radius:8px;padding:14px 6px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.08em;color:#fff;display:grid;gap:2px;justify-items:center;}
.fight small{font-size:12px;font-weight:500;letter-spacing:0;opacity:.9;}
.fight.a{background:linear-gradient(180deg,#b3443c,#8a2f29);}.fight.d{background:linear-gradient(180deg,#8c8a35,#6b6924);}
.fight:disabled{opacity:.4;}
.fight:active:not(:disabled){transform:translateY(1px);filter:brightness(1.15);}

/* market */
.up{color:var(--ok);}.dn{color:var(--hp);}
.mlist{display:grid;gap:6px;}
.mrow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;min-width:0;}
.mrow .mn{flex:1;min-width:0;display:grid;}.mrow .mn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow small{font-size:12px;}
.mrow .mp{display:grid;justify-items:end;font-family:var(--display);font-variant-numeric:tabular-nums;}
.spark{width:56px;height:24px;flex:none;}
.dm{font-style:normal;}.dm.hot{color:var(--brass2);}.dm.cold{color:var(--en);}
.linkrow{background:none;border:0;text-align:left;padding:0;min-width:0;}
.thead{display:flex;gap:10px;align-items:center;}
.thead .ti{font-size:34px;width:46px;text-align:center;flex:none;}.thead .ti svg{width:42px;height:42px;margin:auto;}
.tprice{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}.tprice small{font-size:13px;}
.town{display:grid;justify-items:end;font-size:12px;color:var(--muted);}.town b{font-family:var(--display);font-size:18px;color:var(--fg);}
#tLive{display:grid;gap:8px;}
.chart{width:100%;height:auto;background:#0f1b22;border:1px solid var(--line);border-radius:8px;font-family:var(--body);}
.chips{align-items:center;}
.book{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.book>div{display:grid;gap:2px;align-content:start;}
.lv{display:flex;justify-content:space-between;background:none;border:0;border-radius:4px;padding:3px 6px;font-size:13px;font-variant-numeric:tabular-nums;}
.lv.ask{color:#e98a80;background:rgba(212,83,74,.08);}.lv.bid{color:#8fd3a6;background:rgba(95,179,122,.08);}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{background:var(--panel2);border:0;padding:11px;font-family:var(--display);font-weight:700;letter-spacing:.08em;color:var(--muted);}
.seg .on.buy{background:#2f7a4c;color:#fff;}.seg .on.sell{background:var(--att);color:#fff;}
.frow{display:flex;align-items:center;gap:10px;}.frow label{flex:1;}
.stepper{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.stepper button{width:40px;background:var(--panel2);border:0;font-size:18px;}
.stepper button:disabled{opacity:.4;}
.stepper input{width:104px;background:#0b161d;border:0;color:var(--fg);font:inherit;font-family:var(--display);font-size:17px;text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums;}
.stepper input:disabled{color:var(--muted);}
.btn.big{padding:14px;font-size:16px;}
.btn.buy{background:#2f7a4c;color:#fff;}.btn.sell{background:var(--att);color:#fff;}

/* gear */
.tile.gt{border-color:var(--rc,var(--line));background:linear-gradient(180deg,#1a2a33,color-mix(in srgb,var(--rc,#22363f) 16%,#22363f));}
.tile.gt.on{box-shadow:0 0 0 2px var(--brass) inset;}
.tile.gt .fw svg{width:44px;height:38px;}
.tile.gt .te{color:var(--fg);}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.slots .tile{min-height:84px;padding-top:5px;}
.slots .tile .fw svg{width:32px;height:30px;}
.slots .tile .te{font-size:10px;}.slots .tile .tn{font-size:13px;}
.tile.empty{opacity:.4;color:var(--muted);border-style:dashed;align-content:center;}
.statstrip.sm{font-size:13px;padding:6px 10px;gap:10px;}
.fr.half{opacity:.6;}
.tape{display:grid;gap:2px;font-size:13px;}
.tape>div{display:grid;grid-template-columns:1fr auto 84px;gap:8px;padding:2px 6px;border-radius:4px;font-variant-numeric:tabular-nums;}
.tape>div.me{background:rgba(217,164,65,.14);}
.tape>div span:last-child{text-align:right;}
.chip:disabled{opacity:.35;}

/* character and companies */
button.lvl{padding:0;color:var(--fg);cursor:pointer;}
.lvl .badge{position:absolute;top:-5px;right:-8px;background:var(--hp);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px;font-weight:600;font-family:var(--body);}
.ebar{position:relative;height:22px;border-radius:5px;background:#0b161d;border:1px solid var(--line);overflow:hidden;}
.ebar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7a5a1c,var(--brass));}
.ebar.full i{background:linear-gradient(90deg,#2f7a4c,var(--ok));}
.ebar.xp i{background:linear-gradient(90deg,#3a4f9a,#7d8fe6);}
.ebar span{position:relative;display:block;font-size:12px;font-weight:600;line-height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.upg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.upg button{display:grid;gap:1px;background:#22343f;border:1px solid var(--line);border-radius:6px;padding:6px 4px;min-width:0;}
.upg button b{font-family:var(--display);font-size:14px;}.upg button small{font-size:11px;color:var(--muted);}
.upg button:disabled{opacity:.45;}
.seg.three{grid-template-columns:repeat(3,1fr);}
.xprow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-family:var(--display);}
.mslist{display:grid;gap:4px;}
.ms{position:relative;display:flex;gap:8px;padding:6px 8px 8px;background:rgba(0,0,0,.18);border-radius:5px;font-size:14px;overflow:hidden;}
.ms i{position:absolute;left:0;bottom:0;height:3px;background:var(--brass);}
.ms.done{color:var(--muted);}.ms.done i{background:var(--ok);}
.ms .mp{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;}
.skrow{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:nowrap;}
.mps{display:flex;flex-wrap:wrap;gap:5px;}
.mps span{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-size:13px;}
.mps span small{color:var(--muted);}.mps span.me{border-color:var(--brass);color:var(--brass2);}.mps span.out{opacity:.5;}
.bill .btn.on{outline:2px solid var(--fg);outline-offset:-2px;}
.bnt{font-size:13px;color:var(--brass2);}
select.fit{flex:none;max-width:45%;}
.cfg{flex-wrap:nowrap;font-size:14px;}
.cfg input{width:84px;flex:none;background:#0b161d;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;font-family:var(--display);text-align:center;padding:7px 4px;font-variant-numeric:tabular-nums;}
.cfg input.mod{border-color:var(--brass);color:var(--brass2);}
.rev{display:grid;gap:6px;margin:8px 0;padding:8px;border:1px solid #6a3a22;border-radius:8px;background:rgba(120,50,20,.18);}
.ebar.rv{height:10px;}.ebar.rv i{background:linear-gradient(90deg,#8a3a1c,#ff8a3d);}
.revrow{display:flex;gap:8px;align-items:center;}.revrow .grow{min-width:0;}.revrow .btn{flex:none;}.revrow .row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.box.warn{border-color:#8a3a1c;background:rgba(120,40,20,.22);}
.crbar{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px;align-items:center;}.ebar.cr i{background:linear-gradient(90deg,#7a5a1c,var(--brass));}.ebar.cr2 i{background:linear-gradient(90deg,#5a3a9a,#b07be6);}
input.num{width:84px;flex:none;background:#0b161d;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;text-align:center;padding:7px 4px;}
details summary{cursor:pointer;padding:4px 0;}
</style>

<div id="app">
  <div id="top">
    <button class="lvl" id="lvl" data-act="tab" data-i="char" aria-label="Veikėjas, misijos ir įgūdžiai">1<small><i id="xpbar"></i></small><span class="badge" id="pBadge" hidden></span></button>
    <div class="bars">
      <div class="bar hp"><i id="hpbar"></i><span id="hptxt">❤ 100/100</span></div>
      <div class="bar en"><i id="enbar"></i><span id="entxt">⚡ 100/100</span></div>
    </div>
    <div class="money"><b id="money">₡ 0</b><span id="inv"></span></div>
    <div class="clock"><span class="flag" id="myflag"></span><span id="clock">Diena 1, 00:00</span>
      <div class="speed" id="speed">
        <button data-s="0" aria-label="Pauzė">❚❚</button><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
      </div>
    </div>
  </div>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="ticker"><b>NAUJIENOS</b><span id="tick1">…</span></div>
    <div class="zoom"><button id="zin" aria-label="Priartinti">+</button><button id="zout" aria-label="Atitolinti">−</button><button id="zhome" aria-label="Mano šalis">⌂</button></div>
    <div class="credit">Sukūrė <a href="https://github.com/nusikales" target="_blank" rel="noopener">Nusikales</a></div>
    <div id="rcard" hidden></div>
    <div id="sheet" hidden><header><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Uždaryti">✕</button></header><div id="sheetBody"></div></div>
  </div>
  <nav id="tabs">
    <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M5 8h14v12H5zM9 8V5h6v3M5 13h14M11 12v3h2v-3"/></svg>Inventorius<span class="badge" id="iBadge" hidden></span></button>
    <button data-t="battles"><svg viewBox="0 0 24 24"><path d="M4 4l9 9M4 4v4M4 4h4M20 4l-9 9M20 4v4M20 4h-4M7 15l-3 3 2 2 3-3M17 15l3 3-2 2-3-3"/></svg>Mūšiai<span class="badge" id="bBadge" hidden></span></button>
    <button data-t="work"><svg viewBox="0 0 24 24"><path d="M3 20V10l5 3V10l5 3V6h3l1 14M3 20h18M17 6h3v14"/></svg>Įmonės</button>
    <button data-t="market"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6M9 20a1 1 0 100-2 1 1 0 000 2zM17 20a1 1 0 100-2 1 1 0 000 2z"/></svg>Rinka</button>
    <button data-t="country"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Šalis<span class="badge" id="eBadge" hidden>!</span></button>
    <button data-t="bots"><svg viewBox="0 0 24 24"><path d="M12 3v3M6 6h12v10H6zM9 11h.01M15 11h.01M9 20h6M3 10v4M21 10v4"/></svg>Botai</button>
    <button data-t="more"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Žinios</button>
  </nav>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
</div>
